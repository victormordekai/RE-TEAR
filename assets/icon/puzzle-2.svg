<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256" width="256" height="256"
     fill="none">
  <title>Quebra-cabeça minimalista</title>
  <desc>Ícone vetorial de quatro peças de quebra-cabeça interligadas, com contorno fino e fundo transparente.</desc>
  <g stroke="#111111" stroke-width="4.5"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Contorno externo: quatro abas distribuídas pelo perímetro -->
    <path d="
      M 42 32
      H 72
      C 72 19 81 10 94 10
      C 107 10 116 19 116 32
      H 214
      Q 224 32 224 42
      V 72
      C 237 72 246 81 246 94
      C 246 107 237 116 224 116
      V 214
      Q 224 224 214 224
      H 116
      C 116 237 107 246 94 246
      C 81 246 72 237 72 224
      H 42
      Q 32 224 32 214
      V 180
      C 19 180 10 171 10 158
      C 10 145 19 136 32 136
      V 42
      Q 32 32 42 32
      Z"/>
    <!-- Divisória vertical: aba orientada para a direita -->
    <path d="
      M 128 32
      V 72
      C 141 72 150 81 150 94
      C 150 107 141 116 128 116
      V 224"/>
    <!-- Divisória horizontal: encaixe orientado para cima -->
    <path d="
      M 32 128
      H 72
      C 72 115 81 106 94 106
      C 107 106 116 115 116 128
      H 224"/>
  </g>
</svg>
